<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Site MJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #4F4F4F;
            color: white;
            font-family: 'Playfair Display',serif;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            height: 90vh;
            margin: 0;
        }
        #btn-play{
            background-color: rgb(0, 0, 0);
            color: #ffffff;
            font-size: 1rem;
            padding: 10px;
            margin: 20px;
            border:  1px solid #d4af37;
            font-family: 'Playfair Display',serif;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease,color 0.3s ease ;
            
        }

        #btn-play:hover{
            background-color: #d4af37;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Michael Jackson - Billie Jean</h1>
    <button id="btn-play">DAR PLAY</button>
    <img src="mj.jpg" height="190px" width="450" alt="mj">
    <p>Feito por Gustavo Rocha em um finde qualquer (eu poderia estar jogando kk).</p>
    <audio id="musica" src="billie jean.mp3"></audio>
    <script src="curso.js" defer></script>
</body>
</html>
